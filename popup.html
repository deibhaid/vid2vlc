<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vid2VLC Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 450px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      background: white;
      border-radius: 8px;
      margin: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #667eea;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    .subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .os-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .os-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .os-btn:hover {
      border-color: #667eea;
      background: #f5f7ff;
    }

    .os-btn.active {
      border-color: #667eea;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .os-icon {
      font-size: 20px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #555;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .default-path {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      font-family: 'Courier New', monospace;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-test {
      background: #4caf50;
      color: white;
    }

    .btn-test:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 16px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .info-box {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 12px;
      margin-top: 16px;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }

    .info-box strong {
      color: #333;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <div class="icon">VLC</div>
      Vid2VLC Settings
    </h1>
    <p class="subtitle">Configure VLC path for streaming videos</p>

    <div class="section">
      <div class="section-title">Operating System</div>
      <div class="os-selector">
        <button class="os-btn" data-os="mac">
          <span class="os-icon">🍎</span>
          <span>macOS</span>
        </button>
        <button class="os-btn" data-os="windows">
          <span class="os-icon">🪟</span>
          <span>Windows</span>
        </button>
        <button class="os-btn" data-os="linux">
          <span class="os-icon">🐧</span>
          <span>Linux</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">VLC Path Configuration</div>
      
      <div class="input-group">
        <label for="vlcPath">VLC Executable Path:</label>
        <input type="text" id="vlcPath" placeholder="Enter custom VLC path or use default">
        <div class="default-path" id="defaultPath">
          Default: <span id="defaultPathText"></span>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-secondary" id="useDefaultBtn">Use Default</button>
        <button class="btn-test" id="testBtn">Test VLC</button>
        <button class="btn-primary" id="saveBtn">Save</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="info-box">
      <strong>How to use:</strong>
      Right-click on any video or page with videos and select:
      <ul style="margin-top: 8px; margin-left: 20px;">
        <li>"Add Stream to VLC" - Stream single video</li>
        <li>"Add All Videos to VLC Playlist" - Add all videos on page</li>
      </ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
